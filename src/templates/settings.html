{% extends "base_local.html" %}
{% block title %}Configurações{% endblock %}
{% block content %}
<div class="max-w-4xl">
    <h2 class="text-2xl font-bold mb-6">Configurações</h2>

    <form method="POST" action="/dashboard/settings" class="space-y-6">
        <!-- Local -->
        <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="font-semibold mb-4">Local</h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Local ID</label>
                    <input type="text" name="local_id" value="{{ local_id }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Local Name</label>
                    <input type="text" name="local_name" value="{{ local_name }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Timezone</label>
                    <input type="text" name="timezone" value="{{ timezone }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Data Dir</label>
                    <input type="text" name="local_data_dir" value="{{ data_dir }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">API Token</label>
                    <input type="text" name="local_api_token" value="{{ local_api_token }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-blue-500">
                </div>
            </div>
        </div>

        <!-- Central -->
        <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="font-semibold mb-4">Central</h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Central API URL</label>
                    <input type="text" name="central_api_base_url" value="{{ central_api_base_url }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Central API Token</label>
                    <input type="text" name="central_api_token" value="{{ central_api_token }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Delivery Interval (ms)</label>
                    <input type="number" name="central_delivery_interval_ms" value="{{ central_delivery_interval_ms }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
            </div>
        </div>

        <!-- Câmera -->
        <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="font-semibold mb-4">Câmera</h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Camera ID</label>
                    <input type="text" name="camera_id" value="{{ camera_id }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Camera Name</label>
                    <input type="text" name="camera_name" value="{{ camera_name }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Hostname</label>
                    <input type="text" name="camera_hostname" value="{{ camera_hostname }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">IP da Câmera</label>
                    <input type="text" name="camera_ip" value="{{ camera_ip }}"
                           placeholder="192.168.0.183"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Username</label>
                    <input type="text" name="camera_username" value="{{ camera_username }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Password</label>
                    <input type="password" name="camera_password" value="{{ camera_password }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
                           placeholder="••••••">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Stream Type</label>
                    <select name="camera_stream_type"
                            class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        <option value="main" {% if camera_stream_type == 'main' %}selected{% endif %}>Main (1080p)</option>
                        <option value="sub" {% if camera_stream_type == 'sub' %}selected{% endif %}>Sub (reduzido)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Channel</label>
                    <input type="number" name="camera_channel" value="{{ camera_channel }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">RTSP URL</label>
                    <input type="text" name="camera_rtsp_url" value="{{ camera_rtsp_url }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Capture Interval (ms)</label>
                    <input type="number" name="camera_capture_interval_ms" value="{{ camera_capture_interval_ms }}"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Resolution (WxH)</label>
                    <div class="flex gap-2">
                        <input type="number" name="camera_capture_width" value="{{ camera_capture_width }}"
                               class="w-1/2 bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        <span class="text-gray-500 self-center">x</span>
                        <input type="number" name="camera_capture_height" value="{{ camera_capture_height }}"
                               class="w-1/2 bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">JPEG Quality</label>
                    <input type="number" name="camera_capture_jpeg_quality" value="{{ camera_capture_jpeg_quality }}" min="1" max="100"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">RTSP Transport</label>
                    <select name="camera_rtsp_transport"
                            class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        <option value="tcp" {% if camera_rtsp_transport == 'tcp' %}selected{% endif %}>TCP</option>
                        <option value="udp" {% if camera_rtsp_transport == 'udp' %}selected{% endif %}>UDP</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-3">
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded text-sm font-medium transition-colors">
                Salvar
            </button>
            <a href="/dashboard/settings"
               class="bg-gray-700 hover:bg-gray-600 text-gray-300 px-6 py-2 rounded text-sm font-medium transition-colors">
                Cancelar
            </a>
        </div>
    </form>

    {% if saved %}
    <div class="mt-4 bg-green-900/50 border border-green-700 text-green-300 px-4 py-3 rounded text-sm">
        Configurações salvas com sucesso. Reinicie o serviço para aplicar mudanças no banco de dados.
    </div>
    {% endif %}
</div>
{% endblock %}
